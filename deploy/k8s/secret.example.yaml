# Template only — the real Secret is created imperatively at deploy time and
# NEVER committed:
#   kubectl create secret generic sentinel-secrets \
#     --from-literal=TELEGRAM_BOT_TOKEN=... \
#     --from-literal=TELEGRAM_CHAT_ID=... \
#     --from-literal=SENTINEL_HEARTBEAT_TOKEN=... \
#     --from-literal=ANTHROPIC_ADMIN_KEY=... \
#     --from-literal=VERCEL_TOKEN=...      (only with a spend block)
# The ConfigMap is created from the real fleet config the same way:
#   kubectl create configmap sentinel-config --from-file=fleet-config.json
apiVersion: v1
kind: Secret
metadata:
  name: sentinel-secrets
stringData:
  TELEGRAM_BOT_TOKEN: REPLACE_ME
  TELEGRAM_CHAT_ID: REPLACE_ME
  SENTINEL_HEARTBEAT_TOKEN: REPLACE_ME
  ANTHROPIC_ADMIN_KEY: REPLACE_ME   # spend report only
  VERCEL_TOKEN: REPLACE_ME          # spend report only
